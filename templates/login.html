{% extends "base.html" %}

{% block content %}
<style>
    /* ---------- SPLIT LAYOUT ---------- */
    .split-auth {
        display: flex;
        min-height: 90vh;
        margin: -20px -24px;
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--bg);
        box-shadow: var(--shadow-lg);
    }

    /* Left side: background image */
    .split-auth .auth-image {
        flex: 1 1 50%;
        background: url("{{ url_for('static', filename='images/bg-image.png') }}") center/cover no-repeat;
        position: relative;
        min-height: 400px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .split-auth .auth-image::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.4), rgba(37, 99, 235, 0.3));
        backdrop-filter: blur(2px);
    }

    .split-auth .auth-image .image-content {
        position: relative;
        z-index: 2;
        text-align: center;
        color: white;
        padding: 30px;
        max-width: 400px;
    }

    .split-auth .auth-image .image-content h1 {
        font-size: 2.8rem;
        font-weight: 700;
        font-family: 'Space Grotesk', sans-serif;
        text-shadow: 0 4px 30px rgba(0,0,0,0.4);
    }

    .split-auth .auth-image .image-content h1 span {
        color: var(--cyan);
        text-shadow: 0 0 30px rgba(34, 211, 238, 0.4);
    }

    .split-auth .auth-image .image-content p {
        font-size: 1.1rem;
        opacity: 0.9;
        margin-top: 8px;
        text-shadow: 0 2px 20px rgba(0,0,0,0.3);
    }

    /* Right side: typewriter + form */
    .split-auth .auth-form-side {
        flex: 1 1 50%;
        background: rgba(15, 23, 42, 0.95);
        backdrop-filter: blur(12px);
        padding: 40px 44px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 500px;
        border-left: 1px solid rgba(34, 211, 238, 0.08);
    }

    /* ---------- TYPEWRITER ---------- */
    .typewriter-container {
        margin-bottom: 28px;
        text-align: center;
    }

    .typewriter-container .greeting {
        font-size: 1rem;
        color: #94A3B8;
        font-weight: 400;
        margin-bottom: 2px;
    }

    .typewriter-container .typed-wrapper {
        font-size: 1.1rem;
        font-weight: 500;
        font-family: 'Fira Code', 'JetBrains Mono', 'Inter', monospace;
        color: #F8FAFC;
        min-height: 4.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 8px 0;
    }

    .typewriter-container .lang-label {
        font-size: 0.7rem;
        color: #94A3B8;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        background: rgba(37, 99, 235, 0.12);
        padding: 2px 12px;
        border-radius: 50px;
        border: 1px solid rgba(34, 211, 238, 0.10);
    }

    .typewriter-container .code-line {
        font-size: 1.1rem;
        font-weight: 500;
        font-family: 'Fira Code', 'JetBrains Mono', 'Inter', monospace;
        background: rgba(0, 0, 0, 0.3);
        padding: 6px 18px;
        border-radius: 10px;
        border: 1px solid rgba(34, 211, 238, 0.06);
        min-height: 2.8rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        flex-wrap: wrap;
        width: 100%;
        max-width: 500px;
        margin: 0 auto;
    }

    .typewriter-container .code-line .typed-text {
        background: linear-gradient(135deg, #60A5FA, #34D399);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 40px rgba(34, 211, 238, 0.15);
        animation: glow-pulse 2.5s ease-in-out infinite alternate;
    }

    .typewriter-container .code-line .cursor {
        display: inline-block;
        width: 2px;
        height: 1.2rem;
        background: var(--cyan);
        margin-left: 2px;
        animation: blink 0.8s step-end infinite;
        vertical-align: middle;
    }

    @keyframes glow-pulse {
        0% { text-shadow: 0 0 20px rgba(34, 211, 238, 0.05); }
        100% { text-shadow: 0 0 50px rgba(34, 211, 238, 0.25); }
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }

    /* ---------- LOGIN FORM ---------- */
    .auth-form-simple .form-group {
        margin-bottom: 18px;
    }

    .auth-form-simple .form-label {
        color: #CBD5E1;
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }

    .auth-form-simple .form-control {
        background: rgba(248, 250, 252, 0.06);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 12px;
        padding: 12px 16px;
        color: #F1F5F9;
        transition: var(--transition);
    }

    .auth-form-simple .form-control:focus {
        border-color: var(--cyan);
        box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15);
        background: rgba(248, 250, 252, 0.08);
    }

    .auth-form-simple .form-control::placeholder {
        color: #64748B;
    }

    .auth-form-simple .btn-login {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(90deg, var(--blue), var(--cyan));
        color: #0B1220;
        font-weight: 700;
        font-size: 1rem;
        transition: var(--transition);
        cursor: pointer;
    }

    .auth-form-simple .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px -8px rgba(37, 99, 235, 0.5);
    }

    .auth-form-simple .auth-links {
        text-align: center;
        margin-top: 20px;
        color: #94A3B8;
    }

    .auth-form-simple .auth-links a {
        color: var(--cyan);
        text-decoration: none;
        font-weight: 600;
    }

    .auth-form-simple .auth-links a:hover {
        text-decoration: underline;
    }

    .auth-form-simple .forgot-password {
        text-align: right;
        margin-top: -10px;
        margin-bottom: 15px;
    }

    .auth-form-simple .forgot-password a {
        color: #94A3B8;
        font-size: 0.85rem;
        text-decoration: none;
        transition: color 0.2s ease;
    }

    .auth-form-simple .forgot-password a:hover {
        color: var(--cyan);
        text-decoration: underline;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 768px) {
        .split-auth {
            flex-direction: column;
            margin: 0;
            border-radius: 0;
            min-height: 100vh;
        }

        .split-auth .auth-image {
            min-height: 180px;
            flex: 0 0 150px;
        }

        .split-auth .auth-image .image-content h1 {
            font-size: 2rem;
        }

        .split-auth .auth-image .image-content p {
            font-size: 0.9rem;
        }

        .split-auth .auth-form-side {
            padding: 30px 20px;
            min-height: auto;
            flex: 1;
            border-left: none;
            border-top: 1px solid rgba(34, 211, 238, 0.08);
        }

        .typewriter-container .code-line {
            font-size: 0.85rem;
            padding: 5px 12px;
            min-height: 2.4rem;
            max-width: 100%;
        }

        .typewriter-container .typed-wrapper {
            min-height: 3.5rem;
        }

        .typewriter-container .code-line .cursor {
            height: 1rem;
        }
    }

    @media (max-width: 576px) {
        .split-auth .auth-image .image-content h1 {
            font-size: 1.5rem;
        }
        .typewriter-container .code-line {
            font-size: 0.7rem;
            padding: 4px 10px;
            min-height: 2rem;
        }
        .typewriter-container .lang-label {
            font-size: 0.6rem;
        }
        .split-auth .auth-form-side {
            padding: 20px 14px;
        }
        .auth-form-simple .form-control {
            padding: 10px 12px;
            font-size: 0.9rem;
        }
    }
</style>

<div class="split-auth">
    <!-- LEFT: Background Image -->
    <div class="auth-image">
        <div class="image-content">
            <h1>Awwalu <span>Devs</span></h1>
            <p>Code · Learn · Build · Succeed</p>
        </div>
    </div>

    <!-- RIGHT: Typewriter + Login Form -->
    <div class="auth-form-side">
        <!-- Typewriter -->
        <div class="typewriter-container">
            <div class="greeting">👋 Welcome back,</div>
            <div class="typed-wrapper">
                <span class="lang-label" id="langLabel">Python</span>
                <div class="code-line">
                    <span class="typed-text" id="typedText"></span>
                    <span class="cursor" id="cursor"></span>
                </div>
            </div>
        </div>

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('login') }}" class="auth-form-simple">
            <div class="form-group">
                <label class="form-label">Username or Email</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username or email" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <div class="forgot-password">
                <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
            </div>
            <button type="submit" class="btn-login">Log In</button>
            <div class="auth-links">
                Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
            </div>
        </form>
    </div>
</div>

<script>
    // ---------- TYPEWRITER: "Welcome to Awwalu Devs" in all languages ----------
    document.addEventListener('DOMContentLoaded', function() {
        const snippets = [
            { lang: 'Python', code: 'print("Welcome to Awwalu Devs")' },
            { lang: 'JavaScript', code: 'console.log("Welcome to Awwalu Devs")' },
            { lang: 'Java', code: 'System.out.println("Welcome to Awwalu Devs")' },
            { lang: 'C++', code: 'cout << "Welcome to Awwalu Devs" << endl;' },
            { lang: 'Ruby', code: 'puts "Welcome to Awwalu Devs"' },
            { lang: 'Go', code: 'fmt.Println("Welcome to Awwalu Devs")' },
            { lang: 'Rust', code: 'println!("Welcome to Awwalu Devs");' },
            { lang: 'TypeScript', code: 'console.log("Welcome to Awwalu Devs");' },
            { lang: 'Swift', code: 'print("Welcome to Awwalu Devs")' },
            { lang: 'Kotlin', code: 'println("Welcome to Awwalu Devs")' },
            { lang: 'PHP', code: 'echo "Welcome to Awwalu Devs";' },
            { lang: 'C#', code: 'Console.WriteLine("Welcome to Awwalu Devs");' }
        ];

        let index = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typedElement = document.getElementById('typedText');
        const langLabel = document.getElementById('langLabel');
        let currentText = '';

        function typeEffect() {
            const fullText = snippets[index].code;
            langLabel.textContent = snippets[index].lang;

            if (isDeleting) {
                currentText = fullText.substring(0, charIndex--);
            } else {
                currentText = fullText.substring(0, charIndex++);
            }

            typedElement.textContent = currentText;

            let speed = isDeleting ? 30 : 60;

            if (!isDeleting && charIndex === fullText.length) {
                speed = 2500; // pause at end
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                index = (index + 1) % snippets.length;
                speed = 400;
            }

            setTimeout(typeEffect, speed);
        }

        typeEffect();
    });
</script>
{% endblock %}
