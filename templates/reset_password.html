{% extends "base.html" %}

{% block content %}
<style>
    .split-auth {
        display: flex;
        min-height: 90vh;
        margin: -20px -24px;
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--bg);
        box-shadow: var(--shadow-lg);
    }

    .split-auth .auth-image {
        flex: 1 1 50%;
        background: url("{{ url_for('static', filename='images/bg-image.png') }}") center/cover no-repeat;
        position: relative;
        min-height: 400px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .split-auth .auth-image::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.4), rgba(37, 99, 235, 0.3));
        backdrop-filter: blur(2px);
    }

    .split-auth .auth-image .image-content {
        position: relative;
        z-index: 2;
        text-align: center;
        color: white;
        padding: 30px;
        max-width: 400px;
    }

    .split-auth .auth-image .image-content h1 {
        font-size: 2.8rem;
        font-weight: 700;
        font-family: 'Space Grotesk', sans-serif;
        text-shadow: 0 4px 30px rgba(0,0,0,0.4);
    }

    .split-auth .auth-image .image-content h1 span {
        color: var(--cyan);
        text-shadow: 0 0 30px rgba(34, 211, 238, 0.4);
    }

    .split-auth .auth-image .image-content p {
        font-size: 1.1rem;
        opacity: 0.9;
        margin-top: 8px;
        text-shadow: 0 2px 20px rgba(0,0,0,0.3);
    }

    .split-auth .auth-form-side {
        flex: 1 1 50%;
        background: rgba(15, 23, 42, 0.95);
        backdrop-filter: blur(12px);
        padding: 40px 44px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 500px;
        border-left: 1px solid rgba(34, 211, 238, 0.08);
    }

    .auth-form-simple .form-group {
        margin-bottom: 18px;
    }

    .auth-form-simple .form-label {
        color: #CBD5E1;
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }

    .auth-form-simple .form-control {
        background: rgba(248, 250, 252, 0.06);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 12px;
        padding: 12px 16px;
        color: #F1F5F9;
        transition: var(--transition);
    }

    .auth-form-simple .form-control:focus {
        border-color: var(--cyan);
        box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15);
        background: rgba(248, 250, 252, 0.08);
    }

    .auth-form-simple .form-control::placeholder {
        color: #64748B;
    }

    .auth-form-simple .btn-primary {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(90deg, var(--blue), var(--cyan));
        color: #0B1220;
        font-weight: 700;
        font-size: 1rem;
        transition: var(--transition);
        cursor: pointer;
    }

    .auth-form-simple .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px -8px rgba(37, 99, 235, 0.5);
    }

    .auth-form-simple .auth-links {
        text-align: center;
        margin-top: 20px;
        color: #94A3B8;
    }

    .auth-form-simple .auth-links a {
        color: var(--cyan);
        text-decoration: none;
        font-weight: 600;
    }

    .auth-form-simple .auth-links a:hover {
        text-decoration: underline;
    }

    .auth-form-simple .info-text {
        color: #94A3B8;
        font-size: 0.9rem;
        text-align: center;
        margin-bottom: 20px;
    }

    .auth-form-simple .info-text i {
        color: var(--cyan);
        margin-right: 8px;
    }

    @media (max-width: 768px) {
        .split-auth {
            flex-direction: column;
            margin: 0;
            border-radius: 0;
            min-height: 100vh;
        }

        .split-auth .auth-image {
            min-height: 180px;
            flex: 0 0 150px;
        }

        .split-auth .auth-image .image-content h1 {
            font-size: 2rem;
        }

        .split-auth .auth-image .image-content p {
            font-size: 0.9rem;
        }

        .split-auth .auth-form-side {
            padding: 30px 20px;
            min-height: auto;
            flex: 1;
            border-left: none;
            border-top: 1px solid rgba(34, 211, 238, 0.08);
        }
    }

    @media (max-width: 576px) {
        .split-auth .auth-image .image-content h1 {
            font-size: 1.5rem;
        }
        .split-auth .auth-form-side {
            padding: 20px 14px;
        }
        .auth-form-simple .form-control {
            padding: 10px 12px;
            font-size: 0.9rem;
        }
    }
</style>

<div class="split-auth">
    <!-- LEFT: Background Image -->
    <div class="auth-image">
        <div class="image-content">
            <h1>Awwalu <span>Devs</span></h1>
            <p>Code · Learn · Build · Succeed</p>
        </div>
    </div>

    <!-- RIGHT: Reset Password Form -->
    <div class="auth-form-side">
        <h2 style="color: #F1F5F9; font-weight: 700; margin-bottom: 8px; text-align: center;">🔐 Create New Password</h2>
        <p class="info-text">
            <i class="bi bi-info-circle"></i> 
            Enter your new password below.
        </p>

        <form method="POST" action="{{ url_for('reset_password', token=token) }}" class="auth-form-simple">
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter new password" required minlength="6">
            </div>
            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Confirm new password" required>
            </div>
            <button type="submit" class="btn-primary">
                <i class="bi bi-check-circle"></i> Reset Password
            </button>
            <div class="auth-links">
                <a href="{{ url_for('login') }}">← Back to Login</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
