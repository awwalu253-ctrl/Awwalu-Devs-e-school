{% extends "base.html" %}
{% block content %}
<div class="text-center mb-5">
    <h2>🎯 Select Your Course</h2>
    <p class="text-muted">Choose the class you are currently enrolled in to see your notes.</p>
</div>
<div class="row justify-content-center">
    {% for course in courses %}
    <div class="col-md-4">
        <form method="POST">
            <input type="hidden" name="course_id" value="{{ course.id }}">
            <button type="submit" class="btn w-100" style="background: {{ course.color }}20; border: 2px solid {{ course.color }}; border-radius: 16px; padding: 30px;">
                <div style="font-size: 2.5rem; color: {{ course.color }};">📘</div>
                <h4 class="mt-2" style="color: {{ course.color }};">{{ course.name }}</h4>
                <p class="text-muted small">{{ course.description }}</p>
            </button>
        </form>
    </div>
    {% endfor %}
</div>
{% endblock %}
