{% extends "base.html" %}
{% block content %}
<h2>{{ quiz.title }}</h2>
<p>{{ quiz.description }}</p>
<form method="POST" action="{{ url_for('submit_quiz', quiz_id=quiz.id) }}">
    {% for q in questions %}
    <div class="card p-3 mb-3">
        <h5>{{ loop.index }}. {{ q.question_text }}</h5>
        {% set options = q.options | from_json %}
        {% for opt in options %}
        <div class="form-check">
            <input class="form-check-input" type="radio" name="q_{{ q.id }}" value="{{ loop.index0 }}" id="q{{ q.id }}_{{ loop.index0 }}">
            <label class="form-check-label" for="q{{ q.id }}_{{ loop.index0 }}">
                {{ opt }}
            </label>
        </div>
        {% endfor %}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Submit Quiz</button>
</form>
{% endblock %}
